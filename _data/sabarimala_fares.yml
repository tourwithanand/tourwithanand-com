# Where each vehicle drops and picks up. Written from the current page text.
# TODO (owner): confirm the rule for each size.
drop_rules:
  - vehicles: "Cars (Sedan, Ertiga, Innova, Crysta, Hycross)"
    drop: "Pamba"
    pickup: "Nilakkal parking, or Pamba if you hold your own privilege parking pass"
    note: "After the drop the car parks at the permitted parking area. Your driver tells you the exact pickup point, which can change with the traffic rules that day."
  - vehicles: "Tempo Traveller 12-seater"
    drop: "Pamba"
    pickup: "Nilakkal only"
    note: "Take the KSRTC bus from Pamba back to Nilakkal after darshan."
  - vehicles: "Tempo Traveller 17 and 26-seater"
    drop: "Nilakkal"
    pickup: "Nilakkal"
    note: "KSRTC buses run between Nilakkal and Pamba."

# Shown under the fare table.
included: "Fuel, driver allowance, tolls, regular parking, waiting during darshan and the return drop are included."
