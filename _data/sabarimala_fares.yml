# Sabarimala (Pamba) fares. ONE source for /sabarimala-taxi-kochi-airport/ and
# /tempo-traveller/kochi-to-sabarimala-pamba/ (fare table, tempo rules, schema offers).
# Prices are whole rupees. Round-trip prices MUST match the Google Ads (Sedan 7,000 · Ertiga 8,500 · Innova 10,000).

currency: INR

# Shown next to the season dates. Update when you re-check the dates / virtual-queue rules.
season_checked: 2026-11-25
season_dates: "Temple opens 16 Nov 2026 · Mandala Pooja 27 Dec 2026 · Reopens 30 Dec 2026 · Makaravilakku 14 Jan 2027"
virtual_queue_url: "https://sabarimalaonline.org"

# One fixed round-trip fare per vehicle, completed within 24 hours, drop back at the pickup point.
# Same fare from Kochi Airport, Kochi city, Aluva and Ernakulam railway stations.
# one_way: TODO (owner) one-way drop to Pamba/Nilakkal. Leave empty ("") and the column stays hidden.
